[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ci"
version = "0.1.0"
description = "Aegis-CI: Evidence-gated, crash-resilient control plane around the AgentSentinel verification kernel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tamilselvan" }
]
dependencies = [
    "agentsentinel>=0.1.0",
    "anyio==4.16.0",
    "cryptography==50.0.2",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pydantic==2.14.4",
    "PyJWT[crypto]==2.15.1",
    "PyYAML==6.0.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "ruff==0.17.1",
    "types-PyYAML==6.0.12.20261122",
]

[project.scripts]
aegis-ci = "aegis.cli:main"
aegis-mcp = "aegis.mcp.server:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.ruff]
src = ["aegis", "tests", "scripts"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "ANN",
    "S",
    "PTH",
]
ignore = [
    "S101",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "E501", "TCH"]
"scripts/**" = ["S"]
"benchmarks/**" = ["ANN", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = ["aegis"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["agentsentinel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
    "--import-mode=importlib",
    "--basetemp=.pytest_tmp",
]
markers = [
    "contract: API/SDK version contract tests against pinned libraries",
    "unit: Fast unit tests requiring no external daemon",
    "adversarial: Security & prompt-injection adversarial gate tests",
    "integration: Live Docker / end-to-end tests",
]
