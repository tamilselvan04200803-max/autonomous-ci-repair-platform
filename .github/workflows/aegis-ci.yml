name: Aegis-CI Control Plane

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  python-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py.lock || pip install -e .
      - name: Ruff lint
        run: python -B -m ruff check aegis tests scripts
      - name: Mypy strict
        run: python -B -m mypy --strict aegis
      - name: Secret scan
        run: python -B scripts/check_secrets.py
      - name: Pytest (non-integration)
        run: python -B -m pytest -m "not integration" -q
      - name: Replay benchmark verification
        run: python -B scripts/generate_report.py
